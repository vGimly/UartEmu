<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0b0f14; color: #e7edf5; }
    header { padding: 24px 32px; border-bottom: 1px solid #202833; background: #10151c; }
    header h1 { margin: 0 0 4px; font-size: 23px; }
    header p { margin: 0; color: #8997a7; }
    main { max-width: 1280px; margin: auto; padding: 22px; }
    .stats, .grid { display: grid; gap: 14px; }
    .stats { grid-template-columns: repeat(4, 1fr); margin-bottom: 14px; }
    .grid { grid-template-columns: 1fr 1fr; }
    .card { background: #111820; border: 1px solid #222d39; border-radius: 12px; padding: 17px; }
    .card h2 { margin: 0 0 12px; font-size: 15px; }
    .stat { font-size: 25px; font-weight: 650; }
    .label, .muted { color: #8795a5; font-size: 12px; }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 9px 0; border-bottom: 1px solid #1d2630; }
    .row:last-child { border-bottom: 0; }
    .sub { margin-top: 3px; color: #718092; font-size: 12px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 999px; background: #27313c; color: #aebccc; font-size: 11px; white-space: nowrap; }
    .ok { background: #153325; color: #73d69a; }
    .warn { background: #3b3016; color: #e4c477; }
    a { color: #82b7ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    button { border: 1px solid #344150; background: #18212b; color: #dbe5ef; border-radius: 6px; padding: 5px 9px; cursor: pointer; }
    button:hover { background: #202c38; }
    @media (max-width: 850px) { .stats, .grid { grid-template-columns: 1fr; } main { padding: 12px; } header { padding: 20px; } }
  </style>
</head>
<body>
  <header>
    <h1>UART Emulator</h1>
    <p>Virtual BMC and protocol management</p>
  </header>
  <main>
    <div class="stats">
      <section class="card"><div class="label">SERVER</div><div id="status" class="stat">—</div></section>
      <section class="card"><div class="label">ACTIVE SESSIONS</div><div id="active" class="stat">—</div></section>
      <section class="card"><div class="label">DEVICES</div><div id="device-count" class="stat">—</div></section>
      <section class="card"><div class="label">PROTOCOLS</div><div id="protocol-count" class="stat">—</div></section>
    </div>

    <div class="grid">
      <section class="card">
        <h2>Devices</h2>
        <div id="devices" class="muted">Loading...</div>
      </section>
      <section class="card">
        <h2>Client sessions</h2>
        <div id="clients" class="muted">Loading...</div>
      </section>
      <section class="card">
        <h2>Protocols</h2>
        <div id="protocols" class="muted">Loading...</div>
      </section>
      <section class="card">
        <h2>Tools</h2>
        <div class="row"><span>API documentation</span><a href="./docs">Swagger UI</a></div>
        <div class="row"><span>Refresh interval</span><span class="badge">5 seconds</span></div>
      </section>
    </div>
  </main>

  <script>
    const api = './api';
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmtDuration = seconds => {
      seconds = Number(seconds || 0);
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;
      return `${h}h ${m}m ${s}s`;
    };

    async function load() {
      try {
        const [status, protocols, devices, clients] = await Promise.all([
          fetch(`${api}/status`).then(r => r.json()),
          fetch(`${api}/protocols`).then(r => r.json()),
          fetch(`${api}/devices`).then(r => r.json()),
          fetch(`${api}/clients`).then(r => r.json())
        ]);

        document.getElementById('status').innerHTML = `<span class="badge ok">${esc(status.status)}</span>`;
        document.getElementById('active').textContent = status.clients;
        document.getElementById('device-count').textContent = devices.length;
        document.getElementById('protocol-count').textContent = protocols.length;

        document.getElementById('devices').innerHTML = devices.length ? devices.map(d => `
          <div class="row">
            <div><strong>${esc(d.name)}</strong><div class="sub mono">id=${esc(d.id)} · identity=${esc(d.identity)}</div></div>
            <div style="text-align:right"><span class="badge">${esc(d.protocol)}</span><div class="sub">${d.state_entries} state entries</div><a href="./devices/${encodeURIComponent(d.id)}">Open state</a></div>
          </div>`).join('') : '<span class="muted">No devices</span>';

        document.getElementById('clients').innerHTML = clients.length ? clients.map(c => `
          <div class="row">
            <div><strong class="mono">${esc(c.host)}:${esc(c.port)}</strong><div class="sub mono">${esc(c.client_key)}</div><div class="sub">${esc(c.device_name || 'unassigned')} · ${esc(c.device_protocol || '—')}</div></div>
            <div style="text-align:right"><span class="badge ${c.connected ? 'ok' : ''}">${c.connected ? 'connected' : 'offline'}</span><div class="sub">${fmtDuration(c.session_duration_seconds)}</div><div class="sub">${c.requests} req · ${c.responses} resp</div></div>
          </div>`).join('') : '<span class="muted">No sessions</span>';

        document.getElementById('protocols').innerHTML = protocols.length ? protocols.map(p => `
          <div class="row"><div><strong>${esc(p.device || p.module)}</strong><div class="sub">${esc(p.description || '')}</div></div><span class="badge">${esc(p.version || 'unknown')}</span></div>`).join('') : '<span class="muted">No protocols</span>';
      } catch (error) {
        document.getElementById('status').innerHTML = '<span class="badge warn">error</span>';
        console.error(error);
      }
    }

    load();
    setInterval(load, 5000);
  </script>
</body>
</html>
